services:
  ollama:
    image: ollama/ollama:0.40.14
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - plotrans-net

  app:
    build: .
    environment:
      OLLAMA_HOST_URL: http://ollama:11434
    volumes:
      - ./outputs:/app/outputs
    ports:
      - "0.0.0.0:8501:8501"
    depends_on:
      - ollama
    networks:
      - plotrans-net

volumes:
  ollama_models:

networks:
  plotrans-net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.230.11.0/24

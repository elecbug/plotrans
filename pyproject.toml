[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-localizer"
version = "0.1.0"
description = "Local PDF paper extraction, summary, and aligned translation"
requires-python = ">=3.11"
dependencies = [
    "opendataloader-pdf==2.5.17",
    "pypdf==6.10.0",
    "pypdfium2==5.14.0",
    "Pillow==12.3.0",
    "markdown-it-py==4.0.0",
    "mdurl==0.1.2",
    "latex2mathml==3.78.1",
    "pyphen==0.18.1",
    "rapidfuzz==3.14.6",
    "pdfplumber==0.11.10",
]

[project.optional-dependencies]
ui = ["streamlit==1.66.1"]
ocr = [
    "rapidocr==3.10.0",
    "onnxruntime==1.23.2",
    "opencv-python-headless==4.12.0.88",
    "numpy==2.2.6",
]

[project.scripts]
paper-localizer = "paper_localizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_localizer = ["assets/*.css", "assets/*.json", "assets/*.gz", "assets/*LICENSE.txt"]
